trigger:
- master

variables:
  dockerRegistryServiceConnection: 'a8a41fca-07c4-4ac2-8bbd-3fe55ab024e6'
  imageRepository: 'aksdeployment'
  containerRegistry: 'masterregestry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:

# ---------------- BUILD STAGE ----------------
- stage: Build
  displayName: Build and Push Image
  jobs:
  - job: Build
    displayName: Build Image
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push image to ACR
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

# ---------------- DEPLOY STAGE ----------------
- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: AKS Deployment
    pool:
      vmImage: $(vmImageName)
    steps:

    - script: |
        sed -i "s|IMAGE_PLACEHOLDER|$(containerRegistry)/$(imageRepository):$(tag)|g" k8s/deployment.yml
      displayName: Update image tag

    - task: Kubernetes@1
      displayName: Apply manifests to AKS
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'newsc'
        azureResourceGroup: 'mastervijayb'
        kubernetesCluster: 'mastercluster'
        namespace: 'default'
        command: 'apply'
        useConfigurationFile: true
        configuration: |
          k8s/deployment.yml
          k8s/service.yml

